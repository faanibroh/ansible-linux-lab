---
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install nginx
  ansible.builtin.apt:
    name: "{{ nginx_package }}"
    state: present

- name: Deploy nginx site configuration
  ansible.builtin.template:
    src: site.conf.j2
    dest: "{{ nginx_site_config_path }}"
    owner: root
    group: root
    mode: '0644'
  notify: Reload nginx

- name: Deploy nginx global configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ nginx_config_path }}"
    owner: root
    group: root
    mode: '0644'
  notify: Reload nginx

- name: Ensure nginx is running
  ansible.builtin.service:
    name: "{{ nginx_service }}"
    state: started
    enabled: true
