---
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true

- name: Install nginx
  ansible.builtin.apt:
    name: "{{ nginx_package }}"
    state: present

- name: Deploy nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/default
    owner: root
    group: root
    mode: '0644'
  notify: Reload nginx

- name: Ensure nginx is running
  ansible.builtin.service:
    name: "{{ nginx_service }}"
    state: started
    enabled: true
