---
- name: Install required packages for Node Exporter
  ansible.builtin.apt:
    name:
      - curl
      - tar
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: monitoring_manage_node_exporter

- name: Create Node Exporter group
  ansible.builtin.group:
    name: "{{ monitoring_node_exporter_group }}"
    state: present
  when: monitoring_manage_node_exporter

- name: Create Node Exporter user
  ansible.builtin.user:
    name: "{{ monitoring_node_exporter_user }}"
    group: "{{ monitoring_node_exporter_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ monitoring_node_exporter_install_dir }}"
    create_home: false
    state: present
  when: monitoring_manage_node_exporter

- name: Create Node Exporter installation directory
  ansible.builtin.file:
    path: "{{ monitoring_node_exporter_install_dir }}"
    state: directory
    owner: "{{ monitoring_node_exporter_user }}"
    group: "{{ monitoring_node_exporter_group }}"
    mode: '0755'
  when: monitoring_manage_node_exporter

- name: Download Node Exporter archive
  ansible.builtin.get_url:
    url: >-
      {{ monitoring_node_exporter_download_base_url ~ '/v' ~
      monitoring_node_exporter_version ~ '/' ~
      monitoring_node_exporter_archive_name }}
    dest: "{{ monitoring_node_exporter_archive }}"
    mode: '0644'
  when: monitoring_manage_node_exporter

- name: Extract Node Exporter archive
  ansible.builtin.unarchive:
    src: "{{ monitoring_node_exporter_archive }}"
    dest: "{{ monitoring_node_exporter_install_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: >-
      {{ monitoring_node_exporter_install_dir }}/node_exporter
  when: monitoring_manage_node_exporter

- name: Install Node Exporter binary
  ansible.builtin.copy:
    src: "{{ monitoring_node_exporter_install_dir }}/node_exporter"
    dest: "{{ monitoring_node_exporter_bin }}"
    remote_src: true
    owner: root
    group: root
    mode: '0755'
  notify: Restart Node Exporter
  when: monitoring_manage_node_exporter

- name: Deploy Node Exporter systemd service
  ansible.builtin.template:
    src: node-exporter.service.j2
    dest: /etc/systemd/system/node-exporter.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart Node Exporter
  when: monitoring_manage_node_exporter

- name: Ensure Node Exporter is enabled and running
  ansible.builtin.service:
    name: node-exporter
    state: started
    enabled: true
  when: monitoring_manage_node_exporter
