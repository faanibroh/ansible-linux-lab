---
monitoring_manage_node_exporter: true

monitoring_node_exporter_version: "1.8.2"
monitoring_node_exporter_user: node_exporter
monitoring_node_exporter_group: node_exporter

monitoring_node_exporter_install_dir: /opt/node_exporter
monitoring_node_exporter_bin: /usr/local/bin/node_exporter

monitoring_node_exporter_port: 9100

monitoring_node_exporter_download_base_url: >-
  https://github.com/prometheus/node_exporter/releases/download

monitoring_node_exporter_archive_name: >-
  node_exporter-{{ monitoring_node_exporter_version }}.linux-amd64.tar.gz

monitoring_node_exporter_archive: "/tmp/node_exporter.tar.gz"

monitoring_node_exporter_download_url: >-
  {{ monitoring_node_exporter_download_base_url ~ '/v' ~
  monitoring_node_exporter_version ~ '/' ~
  monitoring_node_exporter_archive_name }}
